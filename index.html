<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LA EMBAJADA DE CRISTO</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#14213d;--muted:#64708a;--line:#dce1ea;--gold:#c9a24a;--green:#1f7a5a;--red:#b3403a}
*{box-sizing:border-box}body{margin:0 auto;padding:16px;max-width:680px;background:var(--bg);color:var(--ink);font:16px/1.45 Arial,sans-serif}
.brand{background:linear-gradient(160deg,#0b1430,#1a2a55);border-bottom:4px solid var(--gold);border-radius:16px;padding:20px;text-align:center;color:#ecd08a;margin-bottom:14px}.brand-mark{font-size:48px}.brand h1{font:700 20px Georgia,serif;letter-spacing:.12em;margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:12px;padding:14px;margin:0 0 14px}
.nav,.top,.tabs{display:flex;gap:8px;margin-bottom:12px}.nav button{flex:1}.roles{display:flex;margin:auto;border:1px solid var(--gold);border-radius:8px;overflow:hidden}
button{font:inherit;cursor:pointer}.roles button,.nav button,.tabs button,.btn2{padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px}.roles button{border:0;border-radius:0}.on{box-shadow:inset 0 -3px 0 var(--gold);font-weight:bold}
label{display:block;font-size:.85rem;color:var(--muted);margin:8px 0 3px}input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#f9fafc;color:var(--ink);font:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{width:100%;padding:12px;border:0;border-radius:8px;margin-top:14px;background:linear-gradient(135deg,#e2c072,#b98a2e);color:#14213d;font-weight:bold}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sum div{border-left:4px solid var(--line);padding-left:10px}.sum small{display:block;color:var(--muted)}.in{border-color:var(--green)!important}.out{border-color:var(--red)!important}.obra{border-color:var(--gold)!important}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.item p{margin:0}.m,.msg{color:var(--muted);font-size:.85rem}.amt{font-weight:bold}.amt.i{color:var(--green)}.amt.e{color:var(--red)}
.flt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.thumb{display:none;max-width:100%;max-height:170px;margin-top:8px}.bar{height:10px;background:var(--line);border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:var(--gold)}
#login{position:fixed;inset:0;background:linear-gradient(160deg,#0b1430,#1a2a55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}#login .box{background:white;border-radius:14px;padding:20px;width:100%;max-width:380px;border-top:4px solid var(--gold)}
#vis{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:16px;z-index:30}#vis img{max-width:100%;max-height:90%}.empty{text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div id="login"><div class="box" id="lbox" hidden><h2>LA EMBAJADA DE CRISTO</h2><label>Correo</label><input id="lem" type="email"><label>Contraseña</label><input id="lpw" type="password"><button class="save" id="lgo">Entrar</button><p id="lerr" class="msg"></p></div></div>
<header class="brand"><div class="brand-mark">✦</div><h1>LA EMBAJADA DE CRISTO</h1></header>
<div class="top"><div class="roles"><button id="rA" class="on">Administrador</button><button id="rT">Técnico</button></div></div>
<div class="nav"><button id="nF" class="on">Finanzas</button><button id="nI">Inventario</button></div>
<div id="vFin">
<div class="card sum" id="sum"></div>
<div class="card"><h2>Presupuesto de la obra</h2><div id="presW"><label>Presupuesto total (Bs)</label><input id="pres" type="number" min="0" step="0.01"></div><div class="bar"><span id="barf"></span></div><p id="presInfo" class="msg"></p></div>
<div class="card"><h2 id="ft">Registrar movimiento</h2><label>Tipo</label><select id="tipo"></select><div id="claseW"><label>Clase de egreso</label><select id="clase"></select></div><label>Categoría</label><select id="cat"></select><label>Descripción</label><input id="desc"><div class="row2"><div><label>Cantidad</label><input id="cant" type="number" min="0"></div><div><label>Unidad</label><input id="uni"></div></div><label>Monto (Bs)</label><input id="monto" type="number" min="0" step="0.01"><label>Fecha</label><input id="fecha" type="date"><label>Proveedor / comprobante</label><input id="prov"><label>Foto factura/compra</label><input id="foto" type="file" accept="image/*"><img id="prev" class="thumb"><button class="save" id="save">Guardar movimiento</button><p id="msg" class="msg"></p></div>
<div class="card"><h2>Egresos por categoría</h2><div id="cats"></div></div>
<div class="card"><h2>Movimientos</h2><button id="xl" class="btn2" hidden>Descargar informe Excel</button><div class="flt"><input id="mes" type="month"><input id="bus" type="search" placeholder="Buscar..."></div><div id="tabs" class="tabs"></div><div id="list"></div></div>
</div>
<div id="vInv" hidden>
<div class="card sum" id="isum"></div>
<div class="card"><h2>Registrar artículo</h2><label>Artículo</label><input id="inom"><div class="row2"><div><label>Categoría</label><select id="icat"></select></div><div><label>Cantidad</label><input id="icant" type="number" min="1"></div></div><div class="row2"><div><label>Estado</label><select id="iest"></select></div><div><label>Ubicación</label><input id="iubi"></div></div><label>Observación</label><input id="iobs"><button class="save" id="iSave">Guardar artículo</button><p id="iMsg" class="msg"></p></div>
<div class="card"><h2>Inventario</h2><button id="ixl" class="btn2" hidden>Descargar inventario Excel</button><div class="flt"><select id="ifc"></select><input id="ibus" type="search" placeholder="Buscar..."></div><div id="iList"></div></div>
</div>
<div class="card" id="bkc"><h2>Nube y copia de seguridad</h2><p id="cst" class="msg">Conectando...</p><p id="who" class="msg"></p><button id="out" class="btn2">Cerrar sesión</button><button id="bk" class="btn2" hidden>Descargar copia de seguridad</button><label>Restaurar copia JSON</label><input id="rs" type="file" accept=".json,application/json"><p id="bmsg" class="msg"></p></div>
<div id="vis"><img id="big"></div>
<script type="module" src="/src/main.js"></script>
</body></html>
